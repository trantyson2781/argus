[project]
name = "argus-arch"
version = "0.1.0"
description = "Control and understanding layer for coding agents: RepoGraph, context retrieval, verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.6.1",
    "textual>=8.2.8",
    "click>=8.1",
]

[project.scripts]
argus = "argus.cli:app"

[project.optional-dependencies]
bench = ["datasets>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/argus"]
